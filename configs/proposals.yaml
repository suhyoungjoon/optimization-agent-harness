# 개선안 제시 기준 (M15-A): 코어 설정, 도메인 용어 없음. 핵심 지표와 방향은 도메인 팩 dimensions.yaml의 metrics.
max_proposals: 3       # 본안으로 보여 줄 최대 개수 (넘치면 잘라 내고 잘린 안을 기록)
per_finding: 1         # 발견 하나당 본안 수 (나머지는 "참고")
min_effect: 0.01       # 핵심 지표 개선폭 최소값 (비율 지표면 0.01 = +1%p). 미만이면 "참고"
min_change_steps: 4    # 최소 변경 추천: 정수가 아닌 값일 때 현재 값~제안 값 사이를 몇 단계로 훑을지
