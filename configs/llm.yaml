# LLM 설정. 모델 교체는 이 파일만 바꾼다 (코드는 core/llm/ 안에서만 호출).
# 실험할 때만 바꾸려면 환경변수 LLM_MODEL, LLM_THINKING, LLM_EFFORT로 덮어쓴다 (파일은 그대로).
# 제공사: azure_openai(기본, 회사 게이트웨이. 맨 아래 azure 섹션의 값이 아래 값을 덮는다) | anthropic(아래 값).
# 환경변수 LLM_PROVIDER(또는 .env)가 우선. anthropic은 선택 설치: pip install -e ".[anthropic]" (2026-10-18 회사 환경 기본값)
provider: azure_openai
model: claude-haiku-4-5      # 비용 절약용 (실제 API 실험, 2026-10). 이전: claude-sonnet-5
# 생각(thinking)과 깊이(effort)는 모델마다 지원이 다르다. 모델을 바꿀 때 두 줄도 같이 맞춘다.
#   Sonnet 5 / Opus 5 계열: thinking: adaptive, effort: low | medium | high | xhigh | max
#   Haiku 4.5: thinking: off, effort: null (adaptive thinking과 effort를 지원하지 않아 보내면 400)
thinking: "off"                # adaptive | "off" (따옴표 필요: YAML은 off를 false로 읽는다)
effort: null
max_tokens: 16000
# 역할별 모델 (위 기본값 위에 덮어씀). 배정은 기본값(Haiku 4.5, 기준선 유지), 분석·개선안은 모델 비교 실험 결과로
# 정했다 (docs/experiment-real-api-2026-10.md 6.9절: 분석은 Haiku 5.5로 충분, 개선안은 Opus 5.5가 확실히 나음)
roles:
  analysis: {model: claude-haiku-5-5, thinking: adaptive, effort: medium}
  proposals: {model: claude-opus-5-5, thinking: adaptive, effort: medium}
  supervisor: {model: claude-opus-5-5, thinking: adaptive, effort: medium}   # M18 (anthropic일 때)
max_llm_calls_per_item: 12     # 한 항목에서 도구 호출 루프가 끝나지 않을 때 끊는 상한
concurrency: 4                 # 동시에 실행할 run 수 (레벨·반복)
cache: true                    # 입력 해시 캐시. 최종 측정 때는 끈다 (환경변수 LLM_CACHE=0이 우선)
# 호출 실패 대응 (M18-a, 모든 에이전트 공통): SDK가 연결 오류·429·5xx를 지수 대기로 다시 시도한다
retries: 2                     # 다시 시도 횟수 (처음 호출 제외)
timeout_s: 180                 # 호출 하나의 시간 제한(초). 추론 모델의 긴 응답을 고려

# 비용 계산용 단가 (USD / 100만 토큰, Anthropic 1st-party 기준, 2026-06 확인)
pricing_per_mtok:
  claude-sonnet-5: {input: 2.0, output: 10.0}
  claude-opus-5: {input: 5.0, output: 25.0}
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}   # 2026-10 확인
  claude-sonnet-5-5: {input: 2.0, output: 10.0}  # 2026-10 확인
  claude-haiku-5-5: {input: 0.10, output: 0.50}  # 2026-10 확인. 프롬프트 10만 토큰 이하 단가 (초과 시 0.50 / 2.50)
# 프롬프트 캐시 단가 배율 (입력 단가 대비): 쓰기 5분 TTL, 읽기
cache_multipliers: {write: 1.25, read: 0.1}

# Azure OpenAI 호환 게이트웨이 (provider: azure_openai일 때). 키 값은 .env에만 둔다 (여기에 쓰지 않는다).
# 요청 경로: {endpoint}/openai/deployments/{deployment}/chat/completions?api-version={api_version}
azure:
  endpoint: https://skax.ai-talentlab.com
  endpoint_env: MY_PROJECT_AZURE_ENDPOINT          # 있으면 endpoint를 덮는다
  api_version: "2024-12-01-preview"
  api_version_env: MY_PROJECT_AZURE_API_VERSION    # 있으면 api_version을 덮는다
  api_key_envs: [MY_PROJECT_AZURE_API_KEY, AZURE_OPENAI_API_KEY]   # 앞의 것이 우선
  # 아래 값은 위 기본값(model, effort, max_tokens, roles, 단가)을 덮는다. thinking은 쓰지 않는다
  model: gpt-4.1-mini                              # 배정 (2026-10-16: gpt-4.1로 올렸다가 비용 때문에 되돌림. 건수만큼 호출이 늘어난다)
  effort: null
  max_tokens: 16000                                # 요청에는 max_completion_tokens로 보낸다 (추론 모델은 추론 토큰 포함)
  roles:                                           # 분석·개선안을 한 단계 올림 (2026-10-16). 이전: 분석 gpt-5-mini, 개선안 gpt-5
    analysis: {model: gpt-5, effort: medium}
    proposals: {model: gpt-5.4, effort: medium}    # gpt-6.1-sol은 Chat Completions에서 도구를 못 써 보류 (아래)
    supervisor: {model: gpt-5.4, effort: medium}   # M18 분석·개선 Supervisor (2026-10-20 결정 35)
  # 모델 이름 → deployment 이름. 비어 있으면 모델 이름을 그대로 deployment로 쓴다.
  # 2026-10-16 실제 호출: gpt-4.1, gpt-4.1-mini, gpt-5, gpt-5-mini, gpt-5.4, gpt-5.6-luna, gpt-6-luna, gpt-6.1-sol 모두 모델 이름 = deployment 이름
  deployments: {}
  # 모델별 옵션. 없는 모델은 기본값(reasoning_effort 안 보냄, max_completion_tokens 사용).
  #   reasoning_effort: 받는 값 목록. 설정의 effort가 목록에 있으면 보내고, xhigh·max면 목록의 마지막 값, 그 밖에는 보내지 않는다
  #   max_tokens_param: 출력 길이 파라미터 이름 (기본 max_completion_tokens. gpt-5 계열은 max_tokens를 거부할 수 있다)
  # temperature 등 샘플링 값은 어느 모델에도 보내지 않는다 (gpt-5 계열은 기본값 외 temperature를 거부한다).
  # 도구(function) + 추론 지원 (Chat Completions, api-version 2024-12-01-preview, 2026-10-16 실제 호출):
  #   gpt-4.1·gpt-4.1-mini: 도구 ✓ (추론 없음) / gpt-5·gpt-5-mini·gpt-5.4: 도구 + reasoning_effort ✓
  #   gpt-5.6-luna: 도구는 reasoning_effort를 보내지 않을 때만 ✓ (옵션 없음으로 둔다)
  #   gpt-6-luna·gpt-6.1-sol: 이 경로에서 도구 ✕ ("도구는 reasoning_effort none일 때만"인데 none을 받지 않음).
  #     Responses API(api-version 2025-04-01-preview 이상)에서는 gpt-6.1-sol이 도구 + 추론 ✓ — 지금 클라이언트는 미지원 (plan.md M14)
  models:
    gpt-5: {reasoning_effort: [minimal, low, medium, high]}
    gpt-5-mini: {reasoning_effort: [minimal, low, medium, high]}
    gpt-5.4: {reasoning_effort: [low, medium, high, xhigh]}
  # 단가 (USD / 100만 토큰). **추정치**: OpenAI 공개 정가 기준 (2026-10-18 정리, 회사 게이트웨이 단가 아님).
  # pricing_estimated가 참이면 사용량 기록에 cost_estimated가 붙고 화면은 금액 뒤에 "(추정)"을 붙인다.
  # cache_read: 캐시 읽기 단가 (모델마다 할인율이 달라 따로 적는다). 없으면 cache_multipliers.read × input
  # 표에 없는 모델(gpt-5.6-luna, gpt-6-luna, gpt-6.1-sol 등)은 비용이 "미확인"으로 남고 토큰 수만 기록한다
  pricing_estimated: true
  pricing_per_mtok:
    gpt-4.1-mini: {input: 0.40, output: 1.60, cache_read: 0.10}
    gpt-4.1: {input: 2.00, output: 8.00, cache_read: 0.50}
    gpt-4o-mini: {input: 0.15, output: 0.60, cache_read: 0.075}
    gpt-4o: {input: 2.50, output: 10.00, cache_read: 1.25}
    gpt-5-mini: {input: 0.25, output: 2.00, cache_read: 0.025}
    gpt-5: {input: 1.25, output: 10.00, cache_read: 0.125}
    gpt-5.4: {input: 1.25, output: 10.00, cache_read: 0.125}   # 단가 미확인: gpt-5와 같다고 가정
  cache_multipliers: {write: 1.0, read: 0.5}       # cache_read가 없는 모델에만 쓴다 (OpenAI는 캐시 쓰기 요금이 없다)

# 임베딩 (M15-C, 검색 도구의 벡터 검색). Anthropic에는 임베딩이 없어 제공사를 따로 정한다.
#   provider: auto(LLM 제공사가 azure_openai면 azure_openai, 아니면 none) | azure_openai | none
#   none이면 검색은 키워드(BM25)만 쓴다. 환경변수 EMBEDDING_PROVIDER, EMBEDDING_MODEL이 우선
#   azure_openai는 위 azure 섹션의 endpoint·api_version·키를 그대로 쓴다. deployment가 비어 있으면 모델 이름
embedding:
  provider: auto
  model: text-embedding-3-small
  deployment: null
  batch_size: 64
