# 관점별 분석 (M12-b). 분석 에이전트를 관점마다 따로 돌리고 결과를 코드로 합친다.
#   id:       관점 식별자 (영문)
#   name:     화면에 보일 이름
#   question: 분석 에이전트 시스템 프롬프트 뒤에 붙는 문단. 이 관점에서 무엇을 깊게 볼지
#   tools:    이 관점에 줄 도구 (코어 집계 도구 + 도메인 분석 도구 이름). 나머지 도구는 보이지 않는다
# 관점을 고칠 때는 tests/test_perspectives.py의 형식 검사를 통과해야 한다.

perspectives:
  - id: failure
    name: 실패 패턴
    question: |
      이번 분석에서는 '실패 패턴' 관점만 본다.
      어느 구간(지점·시간대·작업유형·매체·건물유형·난이도·관할 경계 여부)에서 어떤 미배정 사유가 몰리는지를 찾는다.
      구간은 가능한 한 좁혀서(여러 차원을 함께) slice에 적는다.
    tools: [overview, aggregate, list_items]

  - id: resource
    name: 자원 활용
    question: |
      이번 분석에서는 '자원 활용' 관점만 본다.
      일할 수 있는 작업자가 실제로 일을 얼마나 하는지, 활용률이 낮거나 한 사람에게 일이 몰리는 작업자가 있는지,
      그 이유가 무엇인지(가능시간, 자격, 기술, 지점)를 찾는다. 자원 쪽 패턴이면 metric에 지표 이름과 방향을 적는다.
    tools: [overview, worker_stats, aggregate]

  - id: time
    name: 시간 수급
    question: |
      이번 분석에서는 '시간 수급' 관점만 본다.
      시간대별 수요(희망시간)와 그 시각에 근무 가능한 인원을 비교해, 언제 수요가 인력을 넘거나 인력이 남는지를 찾는다.
      시간대 구간은 slice의 hour에 적는다.
    tools: [overview, demand_by_hour, aggregate]
