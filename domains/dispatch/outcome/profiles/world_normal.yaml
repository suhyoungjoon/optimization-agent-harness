# 세상 설정 (보통). AI에게 보여 주지 않는 정답표다. 프롬프트·도구 결과에 이 파일 원문을 넣지 않는다.
profile: normal

response:
  # 희망 시각과 배정 시각 차이의 절댓값(분)으로 구간을 고른다. 경계값은 포함(<=). 마지막 줄은 그보다 큰 차이
  bands_min: [0, 30, 60, 90]
  # 건물유형별로 차이에 더하는 분 (아파트 고객이 덜 기다려 준다)
  tolerance_shift_min: {house: 0, apartment: 10}
  # 작업유형별 구간 확률 [수락, 불만(완료는 됨), 일정 재요청, 취소]
  by_work_type:
    install:                       # 개통: ±60분까지 대체로 수락
      - {accept: 0.97, complain: 0.02, reschedule: 0.01, cancel: 0.00}
      - {accept: 0.94, complain: 0.03, reschedule: 0.03, cancel: 0.00}
      - {accept: 0.88, complain: 0.06, reschedule: 0.05, cancel: 0.01}
      - {accept: 0.65, complain: 0.17, reschedule: 0.14, cancel: 0.04}
      - {accept: 0.45, complain: 0.27, reschedule: 0.18, cancel: 0.10}
    repair:                        # 장애: 30분을 넘기면 불만 급증 (P5)
      - {accept: 0.95, complain: 0.03, reschedule: 0.02, cancel: 0.00}
      - {accept: 0.85, complain: 0.09, reschedule: 0.05, cancel: 0.01}
      - {accept: 0.40, complain: 0.42, reschedule: 0.12, cancel: 0.06}
      - {accept: 0.25, complain: 0.50, reschedule: 0.15, cancel: 0.10}
      - {accept: 0.15, complain: 0.55, reschedule: 0.15, cancel: 0.15}

carryover:
  max_carry_days: 2                # 이틀 넘게 밀리면 취소
  per_day: {complain: 0.08, cancel: 0.04}   # 하루 밀릴 때마다 불만·취소 확률 가산 (수락에서 뺀다)

truth:                             # 채점용 정답 (N4). 분석 agent에게 주지 않는다
  P5:
    name: 장애 고객 지연 민감
    answer: {dims: {work_type: repair}, outcome_metric: complaint_rate, direction: high, delay_over_min: 30}
