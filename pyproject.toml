[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-agent-harness"
version = "0.1.0"
description = "Rule-based baseline vs. harness-leveled LLM agents, with analysis and improvement loop"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
    "anthropic>=1.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
workflow = [            # Agent workflow (LangGraph) 화면, M9
    "langgraph>=1.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["core*", "domains*", "api*", "workflow*", "scripts*", "configs"]   # configs: 하네스 레벨·LLM 설정 (package-data로 yaml 포함)

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
